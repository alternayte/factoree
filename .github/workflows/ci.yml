name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    # The Prisma CLI resolves DATABASE_URL eagerly, so every CLI call needs a value.
    # The integration tests inject the real per-container URL, so a placeholder is correct.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `tests/integration/playwright-browser-driver.test.ts` drives a real browser, and the
      # runner carries none. The integration stage never reached it before, because the unit
      # stage failed first and `npm run verify` stops at the first failing stage. Chromium alone
      # is enough: `src/adapters/browser/playwright/playwright-browser-driver.ts` launches it.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
