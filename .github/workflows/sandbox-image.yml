name: sandbox-image
# docs/specs/kiln-sandbox-provider.md. Builds sandbox/Dockerfile and publishes it to ghcr.io. The job
# summary names the digest. A development build pins no sandbox image, so its install settings take
# this digest as the image override. A release builds its own and bakes it in (release.yml).
on:
  push:
    branches: [main]
    paths: [sandbox/**, .github/workflows/sandbox-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/factoree-sandbox:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/factoree-sandbox:latest
      - run: echo "Sandbox image override: ghcr.io/${{ github.repository_owner }}/factoree-sandbox@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
